name: Release Vinttea

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Package Vinttea Windows Release
        run: powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1 -SkipBuild

      - name: Remove obsolete release ZIP assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const expectedAsset = `Vinttea-${tag}-Windows.zip`
            let release
            try {
              release = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag
              })
            } catch (error) {
              if (error.status === 404) return
              throw error
            }

            for (const asset of release.data.assets) {
              if (asset.name.toLowerCase().endsWith('.zip') && asset.name !== expectedAsset) {
                core.info(`Removing obsolete asset ${asset.name}`)
                await github.rest.repos.deleteReleaseAsset({
                  ...context.repo,
                  asset_id: asset.id
                })
              }
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-release/*.zip
          overwrite_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
